<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>آنالوگرام · نورولیا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           پالت رنگی بنفش-صورتی
           ================================================================ */
        :root {
            --bg-deep: #69349e;
            --bg-surface: #51237e;
            --bg-card: rgba(211, 0, 209, 0.06);
            --bg-card-hover: rgba(211, 0, 209, 0.08);
            --border-glass: rgba(211, 0, 209, 0.10);
            --border-glass-hover: rgba(211, 0, 209, 0.25);
            --primary: #D100D1;
            --primary-dark: #A300A3;
            --primary-glow: rgba(209, 0, 209, 0.20);
            --secondary: #A300A3;
            --secondary-glow: rgba(163, 0, 163, 0.15);
            --success: #34D399;
            --error: #FF6B81;
            --text-primary: #FFFFFF;
            --text-secondary: #E8D0F0;
            --text-muted: #A070B0;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.40), 0 0 0 1px rgba(209, 0, 209, 0.04);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.50), 0 0 0 1px rgba(209, 0, 209, 0.10);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --letter-size: 52px;
            --letter-font: 20px;
        }

        /* ===== تم روشن ===== */
        [data-theme="light"] {
            --bg-deep: #F8F0FC;
            --bg-surface: #FFFFFF;
            --bg-card: rgba(163, 0, 163, 0.06);
            --bg-card-hover: rgba(163, 0, 163, 0.12);
            --border-glass: rgba(163, 0, 163, 0.12);
            --border-glass-hover: rgba(163, 0, 163, 0.25);
            --primary: #A300A3;
            --primary-dark: #7A007A;
            --primary-glow: rgba(163, 0, 163, 0.10);
            --secondary: #D100D1;
            --secondary-glow: rgba(209, 0, 209, 0.08);
            --text-primary: #1A002A;
            --text-secondary: #4A2060;
            --text-muted: #8A609A;
            --shadow-card: 0 8px 32px rgba(163, 0, 163, 0.06), 0 0 0 1px rgba(163, 0, 163, 0.04);
            --shadow-hover: 0 12px 48px rgba(163, 0, 163, 0.10), 0 0 0 1px rgba(163, 0, 163, 0.08);
            --icon-filter: none;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background: var(--bg-deep);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            direction: rtl;
            transition: background 0.4s ease;
        }

        /* ===== دکمه تغییر تم ===== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 100;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            color: var(--text-muted);
        }

        .theme-toggle:hover {
            background: rgba(209, 0, 209, 0.06);
            border-color: rgba(209, 0, 209, 0.15);
            transform: scale(1.06) rotate(-8deg);
        }

        .theme-toggle:active { transform: scale(0.92); }

        [data-theme="light"] .theme-toggle {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(163, 0, 163, 0.12);
        }

        [data-theme="light"] .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(163, 0, 163, 0.25);
        }

        @media (max-width: 400px) {
            .theme-toggle {
                top: 12px;
                left: 12px;
                width: 36px;
                height: 36px;
                font-size: 15px;
            }
        }

        /* ================================================================
           کانتینر اصلی
           ================================================================ */
        .game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            height: 100dvh;
            max-height: 920px;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: var(--transition);
        }

        @media (max-width: 440px) {
            .game-container { border-radius: 0; max-height: 100vh; height: 100vh; border: none; }
        }

        /* ================================================================
           هدر
           ================================================================ */
        .header {
            padding: 0;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(16, 28, 46, 0.60);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px 32px 0 0;
            transition: var(--transition);
        }
        @media (max-width: 440px) { .header { border-radius: 0; } }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 6px 12px 6px 8px;
            height: 58px;
            position: relative;
        }

        .header-title {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.3px;
            transition: color 0.4s ease;
        }
        .header-title .icon {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header-title .icon svg {
            width: 100%;
            height: 100%;
            fill: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            min-height: 34px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-icon:hover {
            background: rgba(209, 0, 209, 0.04);
            border-color: rgba(209, 0, 209, 0.10);
            color: var(--text-primary);
            transform: scale(1.03);
        }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon .icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-icon .icon svg { width: 100%; height: 100%; fill: currentColor; }
        .btn-icon.danger { color: var(--error); border-color: rgba(255, 107, 129, 0.12); }
        .btn-icon.danger:hover { background: rgba(255, 107, 129, 0.06); border-color: rgba(255, 107, 129, 0.15); }

        /* ================================================================
           آمار
           ================================================================ */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin: 10px 16px 6px;
            font-size: 11px;
            font-weight: 500;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            justify-content: center;
            white-space: nowrap;
            transition: color 0.4s ease;
        }
        .stats .icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .stats .icon svg { width: 100%; height: 100%; fill: var(--text-muted); }
        .stats .stat-value {
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            transition: color 0.4s ease;
        }

        /* ================================================================
           کلمه به‌هم‌ریخته
           ================================================================ */
        .scrambled-area {
            text-align: center;
            margin: 4px 16px 2px;
            flex-shrink: 0;
        }
        .scrambled-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: color 0.4s ease;
        }
        .scrambled-label .icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .scrambled-label .icon svg { width: 100%; height: 100%; fill: var(--text-muted); }

        .scrambled-word {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--text-primary);
            min-height: 48px;
            word-break: break-all;
            transition: var(--transition);
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            padding: 4px 0;
            line-height: 1.3;
            text-shadow: 0 0 40px var(--primary-glow);
        }

        /* ================================================================
           کلمه ساخته شده
           ================================================================ */
        .build-area {
            text-align: center;
            margin: 2px 16px 6px;
            flex-shrink: 0;
        }
        .build-label {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: color 0.4s ease;
        }
        .build-label .icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .build-label .icon svg { width: 100%; height: 100%; fill: var(--text-muted); }

        .build-word {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--primary);
            min-height: 38px;
            border-bottom: 2px dashed var(--border-glass);
            padding-bottom: 4px;
            transition: var(--transition);
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            line-height: 1.3;
        }

        /* ================================================================
           وضعیت
           ================================================================ */
        .status {
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            min-height: 28px;
            margin: 2px auto 6px;
            padding: 4px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: auto;
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            transition: var(--transition);
            max-width: 92%;
            word-break: break-word;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
        }
        .status .icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .status .icon svg { width: 100%; height: 100%; fill: currentColor; }

        /* ================================================================
           حروف
           ================================================================ */
        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 6px 16px 10px;
            min-height: 60px;
            flex: 1;
            align-content: center;
        }

        .letter-btn {
            width: var(--letter-size);
            height: var(--letter-size);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-size: var(--letter-font);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            backdrop-filter: blur(8px);
        }
        .letter-btn:hover:not(:disabled) {
            transform: scale(1.06);
            background: var(--primary-glow);
            border-color: var(--border-glass-hover);
            box-shadow: 0 0 30px var(--primary-glow);
        }
        .letter-btn:active:not(:disabled) { transform: scale(0.92); }
        .letter-btn:disabled {
            opacity: 0.3;
            transform: scale(0.92);
            cursor: not-allowed;
        }
        .letter-btn.used {
            background: var(--primary-glow);
            color: var(--text-muted);
            border-color: var(--border-glass);
            transform: scale(0.92);
        }

        /* ================================================================
           دکمه‌های اقدام
           ================================================================ */
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 0 16px 16px;
            flex-shrink: 0;
        }
        .actions .btn {
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid var(--border-glass);
            font-size: 12px;
            font-weight: 600;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            flex: 1 1 auto;
            min-width: 80px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 42px;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        .actions .btn:hover:not(:disabled) {
            transform: scale(1.02);
            background: var(--primary-glow);
            border-color: var(--border-glass-hover);
            color: var(--text-primary);
        }
        .actions .btn:active:not(:disabled) { transform: scale(0.95); }
        .actions .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        .actions .btn .icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .actions .btn .icon svg { width: 100%; height: 100%; fill: currentColor; }

        .actions .btn.success {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-color: var(--border-glass);
            color: var(--primary);
        }
        .actions .btn.success:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-color: var(--border-glass-hover);
            box-shadow: 0 0 40px var(--primary-glow);
        }

        /* ================================================================
           مودال
           ================================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(105, 52, 158, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass-hover);
            border-radius: var(--radius-lg);
            padding: 28px 24px 24px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            transition: all 0.4s ease;
        }
        .modal-box h2 {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            transition: color 0.4s ease;
        }
        .modal-box h2 .icon {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .modal-box h2 .icon svg { width: 100%; height: 100%; fill: var(--success); }

        .modal-box .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-glass);
            font-size: 14px;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            transition: var(--transition);
            gap: 8px;
            color: var(--text-secondary);
        }
        .modal-box .summary-item:last-child { border-bottom: none; }
        .modal-box .summary-item .value {
            color: var(--primary);
            font-weight: 700;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal-actions .btn {
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid var(--border-glass);
            font-size: 13px;
            font-weight: 600;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            flex: 1 1 auto;
            min-width: 80px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 40px;
        }
        .modal-actions .btn:hover:not(:disabled) {
            transform: scale(1.03);
            border-color: var(--border-glass-hover);
            color: var(--text-primary);
        }
        .modal-actions .btn:active:not(:disabled) { transform: scale(0.95); }
        .modal-actions .btn .icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .modal-actions .btn .icon svg { width: 100%; height: 100%; fill: currentColor; }

        .modal-actions .btn.success {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-color: var(--border-glass);
            color: var(--primary);
        }
        .modal-actions .btn.success:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-color: var(--border-glass-hover);
            box-shadow: 0 0 40px var(--primary-glow);
        }

        /* ================================================================
           ریسپانسیو
           ================================================================ */
        @media (max-width: 400px) {
            :root {
                --letter-size: 44px;
                --letter-font: 17px;
            }
            .header-top { height: 50px; padding: 4px 8px; }
            .header-title { font-size: 16px; }
            .header-title .icon { width: 22px; height: 22px; }
            .btn-icon { font-size: 10px; padding: 3px 8px; min-height: 28px; }
            .btn-icon .icon { width: 12px; height: 12px; }
            .stats { padding: 6px 8px; margin: 8px 12px 4px; gap: 2px 6px; font-size: 10px; }
            .stats .icon { width: 12px; height: 12px; }
            .stats .stat-value { font-size: 11px; }
            .scrambled-word { font-size: 24px; letter-spacing: 4px; min-height: 40px; }
            .build-word { font-size: 20px; letter-spacing: 3px; min-height: 32px; }
            .letters-grid { gap: 6px; margin: 4px 12px 8px; min-height: 50px; }
            .actions { padding: 0 12px 12px; gap: 6px; }
            .actions .btn { padding: 8px 14px; font-size: 11px; min-height: 36px; min-width: 60px; }
            .modal-box { padding: 24px 18px 20px; max-width: 290px; }
            .modal-box h2 { font-size: 18px; }
            .modal-box .summary-item { font-size: 13px; }
            .modal-actions .btn { padding: 8px 16px; font-size: 12px; min-height: 34px; }
        }

        @media (max-width: 350px) {
            :root {
                --letter-size: 36px;
                --letter-font: 14px;
            }
            .scrambled-word { font-size: 20px; letter-spacing: 3px; min-height: 34px; }
            .build-word { font-size: 17px; letter-spacing: 2px; min-height: 28px; }
            .header-title { font-size: 14px; }
            .header-title .icon { width: 18px; height: 18px; }
            .modal-box { padding: 18px 14px 16px; max-width: 260px; }
            .modal-box h2 { font-size: 16px; }
            .modal-box .summary-item { font-size: 12px; padding: 4px 0; }
            .modal-actions .btn { padding: 6px 12px; font-size: 11px; min-height: 30px; }
            .modal-actions .btn .icon { width: 12px; height: 12px; }
        }

        @media (max-height: 700px) {
            :root {
                --letter-size: 40px;
                --letter-font: 16px;
            }
            .header-top { height: 46px; }
            .stats { padding: 4px 8px; margin: 6px 12px 2px; font-size: 9px; }
            .scrambled-word { font-size: 20px; min-height: 34px; letter-spacing: 4px; }
            .build-word { font-size: 18px; min-height: 28px; }
            .letters-grid { gap: 5px; margin: 4px 12px 6px; min-height: 44px; }
            .actions { padding: 0 12px 10px; gap: 5px; }
            .actions .btn { padding: 6px 12px; font-size: 10px; min-height: 30px; }
            .status { font-size: 10px; min-height: 22px; padding: 3px 12px; }
        }

        /* ================================================================
           انیمیشن‌ها
           ================================================================ */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.2; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: pop 0.3s cubic-bezier(.34, 1.56, .64, 1) both; }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .glow-pulse { animation: glowPulse 2s ease-in-out infinite; }

            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
        }
    </style>
</head>

<script>

    function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);

        const toggleBtn = document.querySelector('.theme-toggle');
        if (toggleBtn) {
            toggleBtn.textContent = theme === 'light' ? '☀️' : '🌙';
        }
    }

    function toggleTheme() {
        const current = document.body.getAttribute('data-theme') || 'dark';
        applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    const savedTheme = localStorage.getItem('nora_theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    document.addEventListener('DOMContentLoaded', function() {

        getWordBank() { return WORDS_BY_LENGTH[this.lang] || WORDS_BY_LENGTH['en']; }

        newGame() {
            if (this.timer) { clearInterval(this.timer); this.timer = null; }
            this.currentLevel = 0;
            this.levelScore = 0;
            this.levelCorrect = 0;
            this.levelAttempts = 0;
            this.wordsDone = 0;
            const cfg = LEVEL_CONFIG[0];
            this.wordsPerLevel = cfg.words_per_level;
            this.timeLimit = cfg.time_limit;
            this.isRunning = true;
            this.isWaiting = false;
            this.el.modal.classList.remove('active');
            this.updateStats();
            this.updateUITexts();
            this.applyLanguage();
            this.startRound();
        }

        startRound() {
            if (!this.isRunning || this.isWaiting) return;
            if (this.wordsDone >= this.wordsPerLevel) { this.showLevelComplete(); return; }

            this.timeLeft = this.timeLimit;
            this.updateStats();

            const cfg = LEVEL_CONFIG[this.currentLevel];
            const [minLen, maxLen] = cfg.word_range;
            let len = minLen + Math.floor(Math.random() * (maxLen - minLen + 1));

            const wordBank = this.getWordBank();
            let pool = wordBank[len] || wordBank[minLen] || (this.lang === 'fa' ? ['آب'] : ['CAT']);
            this.currentWord = pool[Math.floor(Math.random() * pool.length)];

            if (this.lang === 'fa') this.currentWord = this.currentWord;
            else this.currentWord = this.currentWord.toUpperCase();

            let arr = this.currentWord.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            this.scrambled = arr;
            this.lettersState = new Array(arr.length).fill(false);
            this.selectedIndices = [];
            this.buildWord = '';

            this.el.scrambled.textContent = this.scrambled.join(' ');
            this.el.build.textContent = '';
            this.renderLetters();
            this.updateStatus(this.texts.status, '#E8D0F0');
            this.startTimer();
        }

        renderLetters() {
            const container = this.el.letters;
            container.innerHTML = '';
            const isFa = this.lang === 'fa';

            this.scrambled.forEach((letter, idx) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn pop-in' + (isFa ? ' fa' : '');
                btn.textContent = letter;
                btn.dataset.index = idx;
                btn.disabled = this.lettersState[idx];
                if (this.lettersState[idx]) btn.classList.add('used');
                btn.addEventListener('click', () => this.clickLetter(idx));
                container.appendChild(btn);
            });
        }

        clickLetter(idx) {
            if (!this.isRunning || this.isWaiting) return;
            if (this.lettersState[idx]) return;
            if (this.buildWord.length >= this.currentWord.length) return;

            this.lettersState[idx] = true;
            this.selectedIndices.push(idx);
            this.buildWord += this.scrambled[idx];
            this.el.build.textContent = this.buildWord;

            const btns = this.el.letters.children;
            if (btns[idx]) { btns[idx].disabled = true; btns[idx].classList.add('used'); }

            if (this.buildWord.length === this.currentWord.length) {
                this.levelAttempts++;
                this.wordsDone++;
                if (this.buildWord === this.currentWord) {
                    this.score += 15;
                    this.levelScore += 15;
                    this.levelCorrect++;
                    this.updateStatusWithIcon(true);
                    this.playSound(true);
                    this.updateStats();
                    this.saveScore();
                    this.isWaiting = true;
                    if (this.timer) { clearInterval(this.timer); this.timer = null; }
                    setTimeout(() => { this.isWaiting = false; this.startRound(); }, 500);
                } else {
                    this.score -= 10;
                    this.levelScore -= 10;
                    this.updateStatusWithIcon(false);
                    this.playSound(false);
                    this.updateStats();
                    this.saveScore();
                    this.isWaiting = true;
                    if (this.timer) { clearInterval(this.timer); this.timer = null; }
                    setTimeout(() => { this.isWaiting = false; this.startRound(); }, 700);
                }
            }
        }

        clearSelection() {
            if (!this.isRunning || this.isWaiting) return;
            this.lettersState.fill(false);
            this.selectedIndices = [];
            this.buildWord = '';
            this.el.build.textContent = '';
            const btns = this.el.letters.children;
            for (let i = 0; i < btns.length; i++) {
                btns[i].disabled = false;
                btns[i].classList.remove('used');
            }
            this.updateStatus(this.texts.status, '#E8D0F0');
        }

        startTimer() {
            if (this.timer) clearInterval(this.timer);
            this.timer = setInterval(() => {
                this.timeLeft--;
                this.updateStats();
                if (this.timeLeft <= 0) {
                    clearInterval(this.timer);
                    this.timer = null;
                    this.updateStatus(this.texts.timeUp, '#FF6B81');
                    this.isWaiting = true;
                    setTimeout(() => { this.isWaiting = false; this.showLevelComplete(); }, 500);
                }
            }, 1000);
        }

        showLevelComplete() {
            if (this.timer) { clearInterval(this.timer); this.timer = null; }
            this.isRunning = false;

            const levelNum = this.currentLevel + 1;
            const accuracy = this.levelAttempts > 0 ? Math.round((this.levelCorrect / this.levelAttempts) * 100) : 0;

            this.el.modalTitle.innerHTML = `<span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16.83 7.17c-.1-.1-.21-.2-.32-.3.3-.51.49-1.12.49-1.87 0-2.93-2.39-4-4-4v2c.46 0 2 .17 2 2 0 .18-.03.33-.07.48-1.1-.89-2.21-1.63-3.24-2.13-2.49-1.19-3.76-.69-4.39-.06-.17.17-.32.38-.44.65s-.04.11-.04.11c-.04.1-.07.2-.1.31L2.49 17.34a3.27 3.27 0 0 0 .81 3.36c.63.63 1.47.97 2.33.97.34 0 .69-.05 1.03-.16l13.14-4.28c.08-.03.17-.05.25-.08h.02c.27-.12.48-.27.65-.44.63-.63 1.13-1.9-.06-4.39a15.6 15.6 0 0 0-1.47-2.41c.76-.52 1.7-.91 2.83-.91V7c-1.67 0-3.03.59-4.08 1.34-.35-.39-.71-.78-1.09-1.17Zm-4.98 10c-.42-.2-.89-.49-1.36-.84-.51-.38-1.02-.82-1.51-1.31s-.93-.99-1.31-1.51a9 9 0 0 1-.84-1.36c-.18-.38-.26-.64-.29-.81l1.05-3.23c.8 1.52 2.04 3.17 3.58 4.71s3.19 2.78 4.71 3.58l-3.23 1.05c-.16-.03-.43-.1-.81-.29Zm-5.81 2.44a1.31 1.31 0 0 1-1.65-1.65l1.26-3.87c.13.2.26.4.41.61.44.59.94 1.17 1.5 1.73s1.14 1.06 1.73 1.5c.21.15.41.28.61.41L6.03 19.6Zm13.26-4.32s-.01 0-.02.01l-.16.05c-.3.04-.94-.04-1.94-.51-1.43-.68-3.06-1.9-4.59-3.43S9.85 8.25 9.16 6.82c-.48-1-.56-1.64-.51-1.94l.05-.16s0-.02.01-.02c.04-.04.15-.07.33-.07.34 0 .93.12 1.79.52.8.38 1.67.95 2.55 1.63-.68.2-1.32.21-1.37.21v2c.84 0 2.03-.2 3.05-.76.12.12.25.22.37.34.36.36.7.72 1.02 1.09-.85.95-1.29 1.8-1.33 1.88l1.79.89s.28-.54.8-1.17c.46.65.86 1.29 1.15 1.9.62 1.3.57 2 .45 2.12Z"/></svg></span> مرحله ${levelNum} کامل شد!`;

            const wordsLabel = this.lang === 'fa' ? 'کلمات تکمیل شده' : 'Words completed';
            const scoreLabel = this.lang === 'fa' ? 'امتیاز مرحله' : 'Level score';
            const accuracyLabel = this.lang === 'fa' ? 'دقت' : 'Accuracy';

            document.querySelector('#modalSummary .summary-item:first-child span:first-child').textContent = wordsLabel;
            document.querySelector('#modalSummary .summary-item:nth-child(2) span:first-child').textContent = scoreLabel;
            document.querySelector('#modalSummary .summary-item:last-child span:first-child').textContent = accuracyLabel;

            this.el.modalWords.textContent = `${this.wordsDone}/${this.wordsPerLevel}`;
            this.el.modalScore.textContent = this.levelScore;
            this.el.modalAccuracy.textContent = accuracy + '%';

            if (this.currentLevel >= LEVEL_CONFIG.length - 1) {
                this.el.modalNext.style.display = 'none';
                this.el.modalFinish.innerHTML = `<span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.55 3.69c-.28-.18-.64-.21-.95-.08-2.5 1.08-5.08.28-7.81-.56-2.96-.91-6.02-1.85-9.19-.48-.37.16-.6.52-.6.92v18.52h2V15.2c2.31-.73 4.69 0 7.21.77 1.89.58 3.81 1.17 5.78 1.17 1.12 0 2.26-.19 3.41-.69.37-.16.6-.52.6-.92V4.52c0-.34-.17-.65-.45-.84Zm-12.74.37c-.16-.03-.31-.06-.47-.08.16.02.31.05.47.08m7.41 10.89c.15.02.29.05.44.07-.15-.02-.29-.04-.44-.07m3.79-6.08c-1 .27-2 .31-3 .2v3c1 .1 2 .06 3-.2v2.96c-.98.31-1.98.34-3 .23v-2.98c-1-.1-2-.34-3-.62v2.96c-.4-.12-.8-.24-1.21-.36-.59-.18-1.19-.36-1.79-.53v-2.97c-1-.28-2-.52-3-.62v3c.05 0 .1.02.15.02-.38-.04-.76-.08-1.14-.08-.67 0-1.34.07-2.01.23v-2.97c1-.27 2-.31 3-.2v-3c-1-.1-2-.06-3 .2V4.18c.98-.31 1.98-.34 3-.23v2.98c1 .1 2 .34 3 .62V4.59c.4.12.8.24 1.21.36.59.18 1.19.37 1.79.53v2.96c1 .28 2 .52 3 .62V6.07c.99.09 1.99.06 3-.18v2.97Z"/><path d="M11 7.55v3c1 .28 2 .62 3 .9v-3c-1-.28-2-.62-3-.9"/></svg></span> ${this.texts.allDone}`;
            } else {
                this.el.modalNext.style.display = 'block';
                this.el.modalFinish.innerHTML = `<span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.55 3.69c-.28-.18-.64-.21-.95-.08-2.5 1.08-5.08.28-7.81-.56-2.96-.91-6.02-1.85-9.19-.48-.37.16-.6.52-.6.92v18.52h2V15.2c2.31-.73 4.69 0 7.21.77 1.89.58 3.81 1.17 5.78 1.17 1.12 0 2.26-.19 3.41-.69.37-.16.6-.52.6-.92V4.52c0-.34-.17-.65-.45-.84Zm-12.74.37c-.16-.03-.31-.06-.47-.08.16.02.31.05.47.08m7.41 10.89c.15.02.29.05.44.07-.15-.02-.29-.04-.44-.07m3.79-6.08c-1 .27-2 .31-3 .2v3c1 .1 2 .06 3-.2v2.96c-.98.31-1.98.34-3 .23v-2.98c-1-.1-2-.34-3-.62v2.96c-.4-.12-.8-.24-1.21-.36-.59-.18-1.19-.36-1.79-.53v-2.97c-1-.28-2-.52-3-.62v3c.05 0 .1.02.15.02-.38-.04-.76-.08-1.14-.08-.67 0-1.34.07-2.01.23v-2.97c1-.27 2-.31 3-.2v-3c-1-.1-2-.06-3 .2V4.18c.98-.31 1.98-.34 3-.23v2.98c1 .1 2 .34 3 .62V4.59c.4.12.8.24 1.21.36.59.18 1.19.37 1.79.53v2.96c1 .28 2 .52 3 .62V6.07c.99.09 1.99.06 3-.18v2.97Z"/><path d="M11 7.55v3c1 .28 2 .62 3 .9v-3c-1-.28-2-.62-3-.9"/></svg></span> ${this.texts.finish}`;
            }
            this.el.modal.classList.add('active');
        }

        goNextLevel() {
            this.el.modal.classList.remove('active');
            this.currentLevel++;
            const cfg = LEVEL_CONFIG[this.currentLevel];
            this.wordsPerLevel = cfg.words_per_level;
            this.timeLimit = cfg.time_limit;
            this.wordsDone = 0;
            this.levelScore = 0;
            this.levelCorrect = 0;
            this.levelAttempts = 0;
            this.isRunning = true;
            this.isWaiting = false;
            this.updateStats();
            this.applyLanguage();
            this.startRound();
        }

        finishGame() {
            this.el.modal.classList.remove('active');
            this.isRunning = false;
            if (this.timer) { clearInterval(this.timer); this.timer = null; }
            const total = this.texts.totalScore + ': ' + this.score;
            alert(this.texts.allDone + '\n' + total);
            this.newGame();
        }

        updateStatus(msg, color) {
            this.el.status.textContent = msg;
            this.el.status.style.color = color;
            this.el.statusIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.49 10 10-4.49 10-10 10m0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8"/><path d="M10 16c-.26 0-.51-.1-.71-.29l-3-3L7.7 11.3l2.29 2.29 5.29-5.29 1.41 1.41-6 6c-.2.2-.45.29-.71.29Z"/></svg>`;
        }

        updateStatusWithIcon(success) {
            const msg = success ? this.texts.correct : this.texts.wrong + ' (صحیح: ' + this.currentWord + ')';
            const color = success ? '#34D399' : '#FF6B81';
            this.el.status.textContent = msg;
            this.el.status.style.color = color;
            this.el.statusIcon.innerHTML = success
                ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.49 10 10-4.49 10-10 10m0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8"/><path d="M10 16c-.26 0-.51-.1-.71-.29l-3-3L7.7 11.3l2.29 2.29 5.29-5.29 1.41 1.41-6 6c-.2.2-.45.29-.71.29Z"/></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M14.83 7.76 12 10.59 9.17 7.76 7.76 9.17 10.59 12l-2.83 2.83 1.41 1.41L12 13.41l2.83 2.83 1.41-1.41L13.41 12l2.83-2.83z"/><path d="M12 2C9.33 2 6.82 3.04 4.93 4.93S2 9.33 2 12s1.04 5.18 2.93 7.07c1.95 1.95 4.51 2.92 7.07 2.92s5.12-.97 7.07-2.92S22 14.67 22 12s-1.04-5.18-2.93-7.07A9.93 9.93 0 0 0 12 2m5.66 15.66c-3.12 3.12-8.19 3.12-11.31 0-1.51-1.51-2.34-3.52-2.34-5.66s.83-4.15 2.34-5.66S9.87 4 12.01 4s4.15.83 5.66 2.34 2.34 3.52 2.34 5.66-.83 4.15-2.34 5.66Z"/></svg>`;
        }

        updateStats() {
            if (this.el.score) this.el.score.textContent = this.score;
            if (this.el.level) this.el.level.textContent = this.currentLevel + 1;
            if (this.el.time) this.el.time.textContent = Math.max(0, this.timeLeft);
            if (this.el.remaining) {
                this.el.remaining.textContent = Math.max(0, this.wordsPerLevel - this.wordsDone);
            }
        }

        playSound(success) {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = success ? 800 : 300;
                osc.type = 'sine';
                gain.gain.value = 0.12;
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (_) {}
        }

        quit() {
            if (this.timer) { clearInterval(this.timer); this.timer = null; }
            this.isRunning = false;
            const quitMsg = this.lang === 'fa' ?
                'آیا از بازی خارج می‌شوید؟ امتیاز شما ذخیره می‌شود.' :
                'Do you want to quit? Your score will be saved.';
            if (confirm(quitMsg)) {
                this.saveScore();
                window.location.href = 'game_app.html';
            } else {
                this.isRunning = true;
                this.startRound();
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.game = new AnagramGame();
    });
</script>

</html>
