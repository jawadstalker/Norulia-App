
workflows:
  android-apk:
    name: Neurolia Android APK
    max_build_duration: 60
    
    environment:
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: "com.deathstalker_owen.neuroliaclean"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Prebuild native Android project
        script: |
          npx expo prebuild --platform android --clean
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true