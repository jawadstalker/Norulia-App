<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NeuroLia — Interactive App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%}
  body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0b0a12}
  *{box-sizing:border-box}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ============ Stage + phone frame ============ */
  .od-stage{min-height:100dvh;display:grid;place-items:center;padding:28px;
    background:
      radial-gradient(900px 520px at 12% -4%, oklch(0.541 0.281 293 / .20), transparent 60%),
      radial-gradient(820px 500px at 92% 104%, oklch(0.63 0.22 297 / .14), transparent 60%),
      linear-gradient(180deg,#0d0b16,#090812)}
  .od-phone{width:410px;height:min(868px,calc(100dvh - 56px));background:#000;border-radius:52px;padding:12px;
    box-shadow:0 44px 120px -30px oklch(0.541 0.281 293 / .5),0 24px 60px -20px rgba(0,0,0,.85)}
  @media (max-width:470px){
    .od-stage{padding:0}
    .od-phone{width:100vw;height:100dvh;border-radius:0;padding:0}
  }

  /* ============ App token system ============ */
  .od-app{
    --bg:oklch(0.973 0.008 292);
    --surface:oklch(1 0 0);
    --surface2:oklch(0.965 0.008 292);
    --fg:oklch(0.28 0.017 254);
    --muted:oklch(0.55 0.027 264);
    --faint:oklch(0.68 0.02 264);
    --border:oklch(0.93 0.007 265);
    --accent:oklch(0.541 0.281 293);
    --accent-strong:oklch(0.46 0.27 293);
    --accent-soft:oklch(0.94 0.06 293);
    --accent-grad:linear-gradient(135deg,oklch(0.541 0.281 293),oklch(0.63 0.22 297));
    --success:oklch(0.7 0.17 163);
    --warn:oklch(0.79 0.15 85);
    --danger:oklch(0.63 0.24 27);
    --teal:oklch(0.7 0.12 190);
    --orange:oklch(0.7 0.17 45);
    --shadow:0 18px 44px -14px oklch(0.541 0.281 293 / .28);
    --shadow-sm:0 6px 20px -8px oklch(0.541 0.281 293 / .22);
    --font-display:'Sora','Inter',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
    --font-fa:'Vazirmatn','Inter',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;
    display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
    font-family:var(--font-body);font-size:15px;line-height:1.5}
  .od-app[data-theme="dark"]{
    --bg:oklch(0.19 0.06 302);
    --surface:oklch(0.25 0.07 302);
    --surface2:oklch(0.30 0.08 302);
    --fg:oklch(0.93 0.014 300);
    --muted:oklch(0.80 0.025 300);
    --faint:oklch(0.66 0.03 300);
    --border:rgba(255,255,255,0.09);
    --accent:oklch(0.76 0.15 302);
    --accent-strong:oklch(0.82 0.14 302);
    --accent-soft:oklch(0.31 0.10 302);
    --accent-grad:linear-gradient(135deg,oklch(0.62 0.18 302),oklch(0.46 0.16 302));
    --success:oklch(0.80 0.17 163);
    --warn:oklch(0.82 0.16 90);
    --danger:oklch(0.72 0.19 27);
    --teal:oklch(0.78 0.12 190);
    --orange:oklch(0.78 0.17 45);
    --shadow:0 18px 44px -14px oklch(0.9 0.1 302 / .35);
    --shadow-sm:0 6px 20px -8px oklch(0.9 0.1 302 / .3)}
  .od-app[dir="rtl"],.od-app[dir="rtl"] button,.od-app[dir="rtl"] input,.od-app[dir="rtl"] select{font-family:var(--font-fa)}

  /* ============ Status bar ============ */
  .od-status{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13.5px;font-weight:600;letter-spacing:.01em}
  .od-status-right{display:flex;align-items:center;gap:7px;color:var(--fg)}

  /* ============ Scroll surfaces ============ */
  .od-screen{height:100%;display:flex;flex-direction:column}
  .od-scroll{flex:1;overflow-y:auto;padding:10px 22px 138px;scrollbar-width:none}
  .od-scroll::-webkit-scrollbar{display:none}
  .od-scroll.sub{padding-bottom:52px}

  /* ============ Typography ============ */
  .h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.16;margin:0}
  .sub{color:var(--muted);font-size:14px;margin:6px 0 0;line-height:1.5}
  .sec-title{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.01em;margin:26px 0 12px;display:flex;align-items:center;gap:8px;color:var(--fg)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.04em;padding:6px 12px;border-radius:999px}
  [dir="rtl"] .h1{letter-spacing:0;line-height:1.4}
  [dir="rtl"] .sec-title{letter-spacing:0;line-height:1.5}
  [dir="rtl"] .sub,[dir="rtl"] p,[dir="rtl"] .bubble,[dir="rtl"] .fb,[dir="rtl"] .cine-desc{line-height:1.8}
  [dir="rtl"] .hero-title,[dir="rtl"] .poem-verse{line-height:1.6}

  /* ============ Surfaces ============ */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-sm)}

  /* ============ Buttons ============ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:none;font-size:14px;font-weight:600;letter-spacing:.02em;padding:0 18px;height:48px;cursor:pointer;transition:filter .2s,background .2s,transform .15s,box-shadow .2s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 10px 24px -8px oklch(0.541 0.281 293 / .55)}
  .btn-primary:hover{filter:brightness(1.09)}
  .btn-ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--border)}
  .btn-ghost:hover{background:color-mix(in oklab,var(--surface2) 55%,var(--accent-soft) 45%)}
  .btn-soft{background:var(--accent-soft);color:var(--accent)}
  .btn-soft:hover{background:var(--accent);color:#fff}
  .btn-block{width:100%}
  .btn:disabled{opacity:.45;cursor:default;filter:none}

  /* ============ Tab bar ============ */
  .od-tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-around;
    padding:6px 8px 20px;background:color-mix(in oklab,var(--surface) 84%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--border)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;min-height:52px;border:none;background:none;color:var(--faint);cursor:pointer;border-radius:16px;position:relative;transition:color .25s}
  .tab:hover{color:var(--muted)}
  .tab:active{transform:scale(.96)}
  .tab.on{color:var(--accent)}
  .tab-ic{position:relative;width:44px;height:28px;display:grid;place-items:center}
  .tab-pill{position:absolute;inset:0;border-radius:14px;background:var(--accent-soft)}
  .tab-lb{font-size:10px;font-weight:600;letter-spacing:.02em}
  .tab-center{flex:0 0 auto;transform:translateY(-18px)}
  .tab-nova{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;color:#fff;background:var(--accent-grad);box-shadow:0 10px 26px -6px oklch(0.541 0.281 293 / .6);position:relative}
  .tab-nova:active{transform:scale(.94)}
  .tab-nova.off{background:var(--surface2);color:var(--muted);box-shadow:var(--shadow-sm)}
  .nova-pulse{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:0}
  .od-home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--fg);opacity:.22;z-index:30}

  /* ============ Dashboard ============ */
  .dash-head{text-align:center;padding-top:8px}
  .dash-head .chip{margin-bottom:12px}
  .hero{margin-top:18px;border-radius:26px;padding:26px 20px 24px;color:#fff;background:var(--accent-grad);position:relative;overflow:hidden;box-shadow:0 20px 46px -16px oklch(0.541 0.281 293 / .55)}
  .aurora{position:absolute;border-radius:50%;filter:blur(26px);opacity:.5;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%)}
  .a1{width:150px;height:150px;top:-60px;inset-inline-end:-40px;animation:drift 9s ease-in-out infinite alternate}
  .a2{width:110px;height:110px;bottom:-50px;inset-inline-start:-30px;animation:drift 11s ease-in-out infinite alternate-reverse}
  @keyframes drift{to{transform:translate(16px,-10px) scale(1.12)}}
  .hero-body{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px}
  .nova-avatar{position:relative;width:104px;height:104px;border-radius:50%;padding:4px;background:rgba(255,255,255,.24);box-shadow:0 10px 24px -6px rgba(0,0,0,.3)}
  .nova-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .spark-badge{position:absolute;bottom:2px;inset-inline-end:2px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .hero-title{font-family:var(--font-display);font-size:20px;font-weight:700;margin:12px 0 0;letter-spacing:-.01em}
  .hero-sub{font-size:13px;color:rgba(255,255,255,.82);margin:2px 0 0}
  .prog{margin-top:16px;padding:18px}
  .prog-top{display:flex;align-items:center;gap:10px}
  .prog-ic{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
  .prog-name{flex:1;font-size:14px;font-weight:600}
  .prog-pct{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--accent)}
  .bar{height:10px;border-radius:999px;background:var(--surface2);margin-top:14px;overflow:hidden}
  .bar-fill{height:100%;border-radius:999px;background:var(--accent-grad);transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .prog-note{margin-top:10px;font-size:12px;color:var(--muted)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:92px}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .tile:active{transform:scale(.97)}
  .tile-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
  .tile-lb{font-size:11px;font-weight:600;text-align:center;line-height:1.35;color:var(--fg)}

  /* ============ Nova chat ============ */
  .nova-head{display:flex;align-items:center;gap:12px;padding-top:6px}
  .nova-head img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
  .nova-name{font-family:var(--font-display);font-size:17px;font-weight:700}
  .nova-on{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--success);font-weight:600}
  .nova-on i{width:7px;height:7px;border-radius:50%;background:var(--success);animation:blink 1.6s infinite}
  .chat{display:flex;flex-direction:column;gap:14px;padding-top:16px}
  .bubble{max-width:78%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.55}
  .bubble-nova{background:var(--surface);border:1px solid var(--border);border-end-start-radius:6px;box-shadow:var(--shadow-sm)}
  .bubble-user{align-self:flex-end;background:var(--accent-grad);color:#fff;border-end-end-radius:6px}
  .typing{display:inline-flex;gap:4px;padding:14px 16px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .chat-sugs{display:flex;gap:8px;flex-wrap:wrap}
  .chip-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s}
  .chip-btn:hover{border-color:var(--accent);color:var(--accent)}
  .chip-btn:active{transform:scale(.96)}
  .input-row{position:sticky;bottom:0;display:flex;gap:8px;margin-top:14px;padding:10px 2px;background:linear-gradient(180deg,transparent,var(--bg) 34%)}
  .chat-input{flex:1;height:48px;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:0 18px;font-size:14px;color:var(--fg)}
  .chat-input::placeholder{color:var(--faint)}
  .send{width:48px;height:48px;border-radius:50%;border:none;background:var(--accent-grad);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;transition:filter .2s,transform .15s}
  .send:active{transform:scale(.92)}
  .send:disabled{opacity:.45;cursor:default}

  /* ============ Brain / protocols ============ */
  .ring-card{display:flex;align-items:center;gap:22px;padding:20px}
  .ring-num{position:relative;width:128px;height:128px;flex:none}
  .ring-num .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:26px}
  .ring-track{fill:none;stroke:var(--surface2);stroke-width:10}
  .ring-fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)}
  .ring-side h3{font-family:var(--font-display);font-size:16px;font-weight:700;margin:0}
  .ring-side p{font-size:13px;color:var(--muted);margin:4px 0 0}
  .proto-card{padding:18px;margin-top:14px}
  .proto-head{display:flex;align-items:center;gap:12px}
  .proto-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
  .proto-name{font-size:15px;font-weight:600}
  .proto-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .proto-foot{display:flex;align-items:center;gap:14px;margin-top:14px}
  .proto-bar{flex:1}
  .proto-pct{font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font-mono)}
  .proto-start{height:36px;padding:0 16px;font-size:12.5px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--accent);font-weight:600;cursor:pointer;transition:all .2s;flex:none}
  .proto-start:hover{border-color:var(--accent);background:var(--accent-soft)}
  .proto-start.started{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

  /* ============ Plan / schedule ============ */
  .plan-sum{padding:18px;display:flex;align-items:center;gap:16px}
  .plan-sum .prog-name{font-size:13.5px}
  .timeline{margin-top:18px;padding-inline-start:6px}
  .tl-item{position:relative;padding-inline-start:44px;padding-bottom:22px}
  .tl-item:not(:last-child)::before{content:'';position:absolute;inset-inline-start:16px;top:34px;bottom:4px;width:2px;background:var(--border)}
  .tl-item.done:not(:last-child)::before{background:color-mix(in oklab,var(--success) 40%,var(--border))}
  .tl-dot{position:absolute;inset-inline-start:8px;top:7px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2.5px solid var(--border);transition:all .25s}
  .tl-item.done .tl-dot{background:var(--success);border-color:var(--success)}
  .tl-dot i{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
  .tl-card{padding:14px 16px;display:flex;align-items:center;gap:12px}
  .tl-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
  .tl-time{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--muted)}
  .tl-name{font-size:14px;font-weight:600}
  .tl-cat{font-size:11.5px;color:var(--muted);margin-top:1px}
  .tl-check{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:none;color:transparent;display:grid;place-items:center;cursor:pointer;flex:none;margin-inline-start:auto;transition:all .2s}
  .tl-check.done{background:var(--success);border-color:var(--success);color:#fff}
  .tl-done-label{font-size:11.5px;font-weight:600;color:var(--success);margin-inline-start:auto}

  /* ============ Modal ============ */
  .od-overlay{position:absolute;inset:0;z-index:60;background:rgba(10,8,18,.45);backdrop-filter:blur(4px);display:flex;align-items:flex-end}
  .od-sheet{width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding:14px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.28)}
  .sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
  .field select,.field input{width:100%;height:48px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);padding:0 14px;font-size:14px;color:var(--fg)}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}

  /* ============ Profile ============ */
  .p-card{padding:22px 20px;border-radius:26px;color:#fff;background:var(--accent-grad);position:relative;overflow:hidden;box-shadow:0 20px 46px -16px oklch(0.541 0.281 293 / .5)}
  .p-avatar{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.5);object-fit:cover;flex:none}
  .p-row{display:flex;align-items:center;gap:14px;position:relative}
  .p-name{font-size:19px;font-weight:700;font-family:var(--font-display)}
  .p-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;margin-top:6px}
  .p-since{font-size:12px;color:rgba(255,255,255,.82);margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 6px;text-align:center;box-shadow:var(--shadow-sm)}
  .stat b{display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--font-display);font-size:20px;font-weight:700}
  .stat span{font-size:10.5px;color:var(--muted);letter-spacing:.03em}
  .menu{padding:6px;border-radius:24px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-top:16px}
  .m-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;min-height:56px}
  .m-row + .m-row{border-top:1px solid var(--border)}
  .m-ic{width:38px;height:38px;border-radius:12px;background:var(--surface2);color:var(--muted);display:grid;place-items:center;flex:none}
  .m-lb{flex:1;font-size:14px;font-weight:500}
  .chev{color:var(--faint);display:flex}
  .seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px}
  .seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border:none;background:none;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
  .seg button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px -4px oklch(0.541 0.281 293 / .5)}

  /* ============ Sub screens ============ */
  .sub-head{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:4px;padding:4px 0 14px;background:var(--bg)}
  .back-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
  .back-btn:active{transform:scale(.94)}
  .sub-title{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin-inline-start:6px}
  [dir="rtl"] .sub-title{letter-spacing:0}
  .flip-rtl{transition:transform .2s}
  [dir="rtl"] .flip-rtl{transform:scaleX(-1)}

  /* ============ Medication ============ */
  .med-journey{padding:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(135deg,var(--surface),var(--accent-soft));border:1px solid var(--border);border-radius:24px}
  .med-journey h3{margin:0;font-size:16px;font-weight:700;font-family:var(--font-display)}
  .med-journey p{color:var(--muted);font-size:13px;margin:4px 0 0}
  .med-days{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent);text-align:center}
  .med-days span{display:block;font-size:11px;color:var(--muted);font-family:var(--font-body);font-weight:500;margin-top:2px}
  .med-card{display:flex;align-items:center;gap:14px;padding:16px;margin-top:12px}
  .med-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
  .med-ic.taken{background:color-mix(in oklab,var(--success) 15%,var(--surface));color:var(--success)}
  .med-name{font-size:15px;font-weight:600}
  .med-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .med-take{width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--border);background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer;flex:none;margin-inline-start:auto;transition:all .2s}
  .med-take.done{background:var(--success);border:none;color:#fff}
  .all-taken{display:flex;align-items:center;gap:8px;margin-top:14px;padding:14px 16px;border-radius:16px;background:color-mix(in oklab,var(--success) 14%,var(--surface));border:1px solid color-mix(in oklab,var(--success) 40%,transparent);color:var(--success);font-size:13.5px;font-weight:600}

  /* ============ Games ============ */
  .react-pad{margin-top:16px;border-radius:26px;background:var(--surface);border:1px solid var(--border);padding:18px 20px;text-align:center;box-shadow:var(--shadow-sm)}
  .react-circle{width:188px;height:188px;border-radius:50%;margin:16px auto 14px;display:grid;place-items:center;cursor:pointer;transition:background .18s,box-shadow .18s,transform .12s;user-select:none;border:none}
  .react-circle:active{transform:scale(.96)}
  .react-circle.idle{background:var(--surface2);color:var(--muted)}
  .react-circle.wait{background:color-mix(in oklab,var(--danger) 16%,var(--surface));color:var(--danger)}
  .react-circle.go{background:var(--success);color:#fff;animation:breathe .7s ease-in-out infinite}
  .react-circle.early{background:color-mix(in oklab,var(--warn) 20%,var(--surface));color:var(--warn)}
  .react-circle.done{background:var(--surface2);color:var(--accent)}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--success) 40%,transparent)}50%{box-shadow:0 0 0 16px transparent}}
  .react-label{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.01em}
  .react-num{font-family:var(--font-mono);font-weight:700;font-size:30px}
  .react-stats{display:flex;justify-content:center;gap:34px;font-size:11px;color:var(--muted);margin-top:4px}
  .react-stats b{display:block;font-family:var(--font-mono);font-size:16px;color:var(--fg);margin-bottom:2px}
  .mem-pad{padding:18px;margin-top:14px}
  .mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mem-card{aspect-ratio:1;border-radius:16px;border:1px solid var(--border);background:var(--surface2);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .2s,border-color .2s,transform .15s}
  .mem-card:active{transform:scale(.96)}
  .mem-card.flip{background:var(--surface);color:var(--accent);border-color:var(--accent);box-shadow:var(--shadow-sm)}
  .mem-card.matched{background:color-mix(in oklab,var(--success) 13%,var(--surface));color:var(--success);border-color:transparent;cursor:default}
  .mem-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .mem-top .moves{font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}

  /* ============ Cultural ============ */
  .cine-hero{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/5;max-height:520px;box-shadow:var(--shadow);margin-top:4px}
  .cine-hero img{width:100%;height:100%;object-fit:cover;display:block}
  .cine-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 32%,rgba(8,6,16,.9) 80%)}
  .cine-info{position:absolute;inset-inline:0;bottom:0;padding:20px 20px 18px}
  .cine-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;padding:5px 10px;border-radius:999px}
  .cine-title{color:#fff;font-family:var(--font-display);font-size:24px;font-weight:700;margin:10px 0 0;letter-spacing:-.01em}
  .cine-genre{color:rgba(255,255,255,.8);font-size:12.5px;margin-top:4px}
  .cine-desc{color:rgba(255,255,255,.86);font-size:13px;line-height:1.6;margin-top:10px;max-width:34ch}
  .why{padding:16px 18px;margin-top:12px;display:flex;gap:12px;align-items:flex-start}
  .why .m-ic{margin-top:0}
  .why p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
  .why b{display:block;font-size:13.5px;color:var(--fg);font-weight:600;margin-bottom:3px}
  .recs{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none;margin-top:6px}
  .recs::-webkit-scrollbar{display:none}
  .rec{flex:0 0 132px;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:transform .2s}
  .rec:hover{transform:translateY(-3px)}
  .rec img{width:100%;height:150px;object-fit:cover;display:block}
  .rec-body{padding:10px 11px}
  .rec-title{font-size:12.5px;font-weight:600;line-height:1.35}
  .rec-genre{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}

  /* ============ Plus / poetry ============ */
  .poem-card{padding:24px 20px;text-align:center;background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--border);border-radius:26px}
  .poem-verse{font-size:19px;font-weight:600;line-height:2;color:var(--fg)}
  .poem-tr{font-size:13px;color:var(--muted);margin-top:12px;font-style:italic;line-height:1.7}
  .q-opt{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;border:1px solid var(--border);background:var(--surface);font-size:14px;color:var(--fg);cursor:pointer;margin-top:8px;text-align:start;transition:all .2s}
  .q-opt:hover{border-color:var(--accent)}
  .q-opt.correct{background:color-mix(in oklab,var(--success) 14%,var(--surface));border-color:var(--success);color:var(--success);font-weight:600}
  .q-opt.wrong{background:color-mix(in oklab,var(--danger) 11%,var(--surface));border-color:var(--danger);color:var(--danger)}
  .q-opt:disabled{cursor:default}
  .fb{font-size:13.5px;line-height:1.65;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);color:var(--fg);border:1px solid var(--border)}
  .pts-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--accent)}

  /* ============ Consult ============ */
  .session{padding:16px;margin-top:12px;display:flex;gap:14px;align-items:center}
  .sess-ava{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);font-size:16px;flex:none}
  .sess-name{font-size:15px;font-weight:600}
  .sess-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .sess-time{font-size:12px;font-weight:600;color:var(--accent);margin-top:4px;display:inline-flex;align-items:center;gap:5px}
  .past-row{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:10px}
  .past-name{font-size:14px;font-weight:600}
  .past-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .done-tag{margin-inline-start:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);padding:4px 10px;border-radius:999px}

  /* ============ Toast ============ */
  .toast{position:absolute;bottom:116px;left:0;right:0;margin:0 auto;width:max-content;max-width:88%;z-index:70;display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:12px 18px;border-radius:999px;box-shadow:0 16px 40px -10px rgba(0,0,0,.4)}
</style>

);

const Bar = ({ pct }) => {
  const [w, setW] = useState('0%');
  useEffect(() => { const id = requestAnimationFrame(() => setW(pct + '%')); return () => cancelAnimationFrame(id); }, [pct]);
  return <div className="bar"><div className="bar-fill" style={{ width: w }} /></div>;
};

const Ring = ({ pct, size = 128, sw = 10, cls = 'ring-fill' }) => {
  const r = (size - sw) / 2, C = 2 * Math.PI * r;
  const [off, setOff] = useState(C);
  useEffect(() => { const id = requestAnimationFrame(() => setOff(C * (1 - pct / 100))); return () => cancelAnimationFrame(id); }, []);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={r} className="ring-track" strokeWidth={sw} />
      <circle cx={size / 2} cy={size / 2} r={r} className={cls} strokeWidth={sw} strokeDasharray={C} strokeDashoffset={off} />
    </svg>
  );
};

/* ================= Nova chat ================= */
const Nova = () => {
  const { t } = useApp();
  const [msgs, setMsgs] = useState([
    { id: 1, who: 'nova', text: t.intro },
    { id: 2, who: 'user', text: t.u1 },
    { id: 3, who: 'nova', text: t.n1 },
  ]);
  const [typing, setTyping] = useState(false);
  const [input, setInput] = useState('');
  const [sent, setSent] = useState(false);
  const scrollRef = useRef(null);
  const idRef = useRef(4);
  const lang = t.L;

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs, typing]);

  const replyFor = (text) => {
    if (text.includes('علائم') || text.includes('symptoms')) return t.nSug1;
    if (text.includes('دارو') || text.includes('medication')) return t.nSug2;
    if (text.includes('برنامه') || text.includes('schedule')) return t.nSug3;
    if (text.includes('پروتکل') || text.includes('protocol')) return t.nSug4;
    return t.n2;
  };

  const send = (raw) => {
    const text = raw.trim();
    if (!text || typing) return;
    setMsgs(m => [...m, { id: idRef.current++, who: 'user', text }]);
    setInput(''); setTyping(true);
    setTimeout(() => {
      setTyping(false);
      setMsgs(m => [...m, { id: idRef.current++, who: 'nova', text: replyFor(text) }]);
      if (!sent) setSent(true);
    }, 1150);
  };

  const sug = [t.sug1, t.sug2, t.sug3, t.sug4];
  const mb = (m) => (
    <motion.div key={m.id} className={m.who === 'nova' ? 'bubble bubble-nova' : 'bubble bubble-user'}
      initial={{ opacity: 0, y: 10, scale: .98 }} animate={{ opacity: 1, y: 0, scale: 1 }}
      transition={{ duration: .28, ease: [0.22, 1, 0.36, 1] }}>
      {m.text}
    </motion.div>
  );

  return (
    <div className="od-scroll" ref={scrollRef} data-od-id="screen-nova">
      <div className="nova-head" data-od-id="nova-header">
        <img src="/api/projects/2a6ae9f1-1ed7-4030-936a-e3cd35e35329/raw/assets/nova-avatar.jpg?workspaceId=s1ruoca9kelfydh208ypr3la&workspaceMemberId=twubed9ieyc3c9rqlqbjbsmr" alt="Nova" />
        <div>
          <div className="nova-name">{t.nova}</div>
          <div className="nova-on"><i />{t.online}</div>
        </div>
        <span className="chip" style={{ marginInlineStart: 'auto' }}><Icon.Spark size={12} />{t.mem}</span>
      </div>
      <div className="chat">
        {msgs.map(mb)}
        {typing && (
          <motion.div key="typing" className="bubble bubble-nova typing"
            initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }}>
            <i /><i /><i />
          </motion.div>
        )}
      </div>
      <div className="input-row">
        <div className="chat-sugs" style={{ position: 'absolute', bottom: 'calc(100% + 10px)', insetInlineStart: 0 }}>
          {sug.map(s => <button key={s} className="chip-btn" onClick={() => send(s)} data-od-id={`nova-sug-${s}`}>{s}</button>)}
        </div>
        <input className="chat-input" value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && send(input)} placeholder={t.askNova} aria-label={t.askNova} />
        <button className="send" onClick={() => send(input)} disabled={!input.trim()} aria-label="send" data-od-id="nova-send">
          <Icon.Send size={19} />
        </button>
      </div>
    </div>
  );
};

/* ================= Games ================= */
const ReactionGame = () => {
  const { t, fmt } = useApp();
  const [phase, setPhase] = useState('idle');
  const [result, setResult] = useState(null);
  const [attempts, setAttempts] = useState(0);
  const [best, setBest] = useState(() => Number(load('nl_best', '0')));
  const tim = useRef(null);
  const goAt = useRef(0);
  useEffect(() => () => clearTimeout(tim.current), []);
  const start = () => {
    if (phase === 'wait' || phase === 'go') return;
    setResult(null); setPhase('wait');
    tim.current = setTimeout(() => { setPhase('go'); goAt.current = performance.now(); }, 1300 + Math.random() * 1500);
  };
  const hit = () => {
    if (phase === 'wait') {
      clearTimeout(tim.current); setPhase('early');
      tim.current = setTimeout(() => setPhase('idle'), 900);
      return;
    }
    if (phase !== 'go') return;
    const d = Math.round(performance.now() - goAt.current);
    setAttempts(a => a + 1); setResult(d); setPhase('done');
    if (!best || d < best) { setBest(d); save('nl_best', String(d)); }
  };
  const label = {
    idle: <><Icon.Play size={26} /><span className="react-label">{t.startGame}</span></>,
    wait: <span className="react-label">{t.waitRed}</span>,
    go: <span className="react-label">{t.tapGreen}</span>,
    early: <span className="react-label">{t.early}</span>,
    done: <span className="react-num">{fmt(result)} <span style={{ fontSize: 12 }}>{t.ms}</span></span>,
  }[phase];
  return (
    <div className="card react-pad" data-od-id="game-reaction">
      <div className="prog-top">
        <span className="prog-ic" style={{ background: tint('var(--success)'), color: 'var(--success)' }}><Icon.Zap size={19} /></span>
        <span className="prog-name">{t.reaGame}</span>
      </div>
      <button className={'react-circle ' + phase} onClick={phase === 'idle' || phase === 'early' ? start : hit} data-od-id="reaction-circle">
        {label}
      </button>
      <div className="react-stats">
        <span><b>{fmt(best || '—')}</b>{t.best} {t.ms}</span>
        <span><b>{fmt(attempts)}</b>{t.moves}</span>
      </div>
    </div>
  );
};

const MemoryGame = () => {
  const { t, fmt } = useApp();
  const syms = [Icon.Star, Icon.Zap, Icon.Heart];
  const [deck, setDeck] = useState(() => shuffle([0, 0, 1, 1, 2, 2]));
  const [open, setOpen] = useState([]);
  const [matched, setMatched] = useState([]);
  const [moves, setMoves] = useState(0);
  const lock = useRef(false);
  const pick = (i) => {
    if (lock.current || open.includes(i) || matched.includes(deck[i])) return;
    const no = [...open, i];
    setOpen(no);
    if (no.length === 2) {
      setMoves(m => m + 1); lock.current = true;
      const [a, b] = no;
      if (deck[a] === deck[b]) setTimeout(() => { setMatched(m => [...m, deck[a]]); setOpen([]); lock.current = false; }, 380);
      else setTimeout(() => { setOpen([]); lock.current = false; }, 820);
    }
  };
  const reset = () => { setDeck(shuffle([0, 0, 1, 1, 2, 2])); setOpen([]); setMatched([]); setMoves(0); };
  const won = matched.length === 3;
  return (
    <div className="card mem-pad" data-od-id="game-memory">
      <div className="mem-top">
        <div className="prog-name">{t.memGame}</div>
        <span className="moves">{t.moves}: {fmt(moves)}</span>
      </div>
      <div className="mem-grid">
        {deck.map((s, i) => {
          const isOpen = open.includes(i) || matched.includes(s);
          const S = syms[s];
          return (
            <button key={i} className={'mem-card' + (isOpen ? (matched.includes(s) ? ' matched' : ' flip') : '')}
              onClick={() => pick(i)} data-od-id={`mem-card-${i}`} disabled={matched.includes(s)}>
              <S size={26} />
            </button>
          );
        })}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 14 }}>
        {won ? <span style={{ color: 'var(--success)', fontWeight: 600, fontSize: 13.5 }}><Icon.Check size={14} /> {t.matchAll}</span> : <span />}
        <button className="btn btn-ghost" style={{ height: 38, fontSize: 12.5, padding: '0 16px' }} onClick={reset} data-od-id="memory-reset">
          <Icon.Refresh size={15} />{t.reset}
        </button>
      </div>
    </div>
  );
};

            <h3 className="sec-title" style={{ margin: '0 0 4px' }}>{t.quiz}</h3>
            <p className="prog-note">{t.quizQ}</p>
            {!started ? (
              <button className="btn btn-primary btn-block" style={{ marginTop: 12 }} onClick={() => setStarted(true)} data-od-id="poem-start">
                <Icon.Spark size={16} />{t.startQuiz}
              </button>
            ) : (
              <>
                {opts.map(o => (
                  <button key={o.v} className={'q-opt' + (picked === null ? '' : (o.v === 0 ? (picked === 0 ? ' correct' : '') : (picked === o.v ? ' wrong' : '')))}
                    disabled={picked !== null} onClick={() => choose(o.v)} data-od-id={`poem-opt-${o.v}`}>
                    {o.label}
                  </button>
                ))}
                {picked !== null && (
                  <motion.div initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }}>
                    <div className="fb">{picked === 0 ? t.correct : t.wrong}</div>
                    <div className="pts-row"><Icon.Star size={14} style={{ color: 'var(--warn)' }} />+{fmt(picked === 0 ? 100 : 0)} {t.pts}</div>
                  </motion.div>
                )}
              </>
            )}
          </div>
        </div>
      </Reveal>
    </div>
  );
};

/* ================= Consult ================= */
const Consult = () => {
  const { t, fmt } = useApp();
  const [toast, setToast] = useState(false);
  const [booked, setBooked] = useState(false);
  useEffect(() => { if (toast) setTimeout(() => setToast(false), 2200); }, [toast]);
  const up = [
    { id: 's1', ini: 'LR', name: t.session1, sub: t.s1sub, time: t.s1time },
    { id: 's2', ini: 'RM', name: t.session2, sub: t.s2sub, time: t.s2time },
  ];
  return (
    <div className="od-scroll sub" data-od-id="screen-consult">
      <SubHead title={t.consult} />
      <Reveal><h2 className="sec-title" style={{ marginTop: 2 }}>{t.upcoming}</h2></Reveal>
      {up.map((s, i) => (
        <Reveal key={s.id} delay={.06 + i * .07}>
          <div className="card session" data-od-id={`session-${s.id}`}>
            <span className="sess-ava">{s.ini}</span>
            <div>
              <div className="sess-name">{s.name}</div>
              <div className="sess-sub">{s.sub}</div>
              <div className="sess-time"><Icon.Clock size={12} />{s.time}</div>
            </div>
          </div>
        </Reveal>
      ))}
      <Reveal delay={.2}>
        <button className="btn btn-primary btn-block" style={{ marginTop: 16 }}
          onClick={() => { setBooked(true); setToast(true); }} data-od-id="consult-book">
          <Icon.Video size={17} />{t.book}
        </button>
      </Reveal>
      <Reveal delay={.24}><h2 className="sec-title" style={{ marginTop: 26 }}>{t.past}</h2></Reveal>
      <Reveal delay={.28}>
        <div className="card past-row" data-od-id="session-past">
          <span className="m-ic"><Icon.Camera size={17} /></span>
          <div>
            <div className="past-name">{t.session1}</div>
            <div className="past-sub">{t.s1sub}</div>
          </div>
          <span className="done-tag"><Icon.Check size={12} /> {t.pastDone}</span>
        </div>
      </Reveal>
      <Toast show={toast} msg={t.booked} />
    </div>
  );
};

/* ================= App ================= */
const SCREENS = {
  home: <Dashboard />, brain: <Brain />, nova: <Nova />, plan: <Plan />, profile: <Profile />,
};
const SUBS = {
  medication: <Medication />, games: <Games />, cultural: <Cultural />, plus: <Plus />, consult: <Consult />,
};

function App() {
  const [lang, setLang] = useState(load('nl_lang', 'en'));
  const [theme, setTheme] = useState(load('nl_theme', 'light'));
  const [tab, setTab] = useState(load('nl_tab', 'home'));
  const [sub, setSub] = useState(null);
  const t = DICT[lang];

  useEffect(() => save('nl_lang', lang), [lang]);
  useEffect(() => save('nl_theme', theme), [theme]);
  useEffect(() => save('nl_tab', tab), [tab]);

  const nav = useMemo(() => ({
    go: (id) => { setSub(null); setTab(id); },
    sub: (id) => setSub(id),
    back: () => setSub(null),
  }), []);

  const ctx = {
    t, lang, theme, setTheme, setLang, nav,
    fmt: (v) => lang === 'fa' ? faDigit(v) : String(v),
  };

  const view = sub ? SUBS[sub] : SCREENS[tab];

  return (
    <div className="od-stage">
      <div className="od-phone">
        <Ctx.Provider value={ctx}>
          <div className="od-app" dir={t.dir} lang={t.L} data-theme={theme} data-od-id="app-root">
            <StatusBar />
            <AnimatePresence mode="wait">
              <motion.div key={sub || tab} className="od-screen"
                initial={{ opacity: 0, y: 26 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -20 }}
                transition={{ duration: .3, ease: [0.22, 1, 0.36, 1] }}>
                {view}
              </motion.div>
            </AnimatePresence>
            {!sub && <TabBar tab={tab} />}
            <div className="od-home" />
          </div>
        </Ctx.Provider>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
